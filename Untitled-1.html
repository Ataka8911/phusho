<!DOCTYPE html>
<html>
<head>
<title>Full Screen Images</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Forum&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    background-color: #F0F0DF;
    scroll-behavior: smooth; 
    overflow-y: scroll; 
    scrollbar-width: none; 
    -ms-overflow-style: none; 
}

html::-webkit-scrollbar, 
body::-webkit-scrollbar {
    display: none;
    width: 0;
    background: transparent;
    scroll-behavior: smooth;
}

</style>
</head>
<style>

.text { 
    font-size: 24px;
    font-family: 'Montserrat', sans-serif;
    background-color: #898989;
    background-clip: text;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}
.naf {
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.ps {
    font-size: 60px;
    font-family: 'Forum', sans-serif;
    background-color: #898989;
    background-clip: text;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}
.OurMain{
    background-image: url('./model/white.png');
    display: flex;
    flex-direction: column;
}
.name {
    display: flex;
}
.bi {
    display: flex;
    justify-content: center;
}
.name1 {
}
.con {
    display: flex;
    top: -10px;
    right: 0;
    padding-right: 32px;
}
.check {
    display: flex;
}
.angel {
    display: flex;
    justify-content: center;
    }
    .angel1 {
    display: flex;
}
.bio1{
    display: flex;
    justify-content: center
    ;
}
.pod {
display: flex;
justify-content: center;
padding-bottom: 120px;
}
.hero{
    justify-items: center;
}
.linking{
    top: 42%;
}
.podPicture{
    scale: 1.2;
}
@media (max-width:2000px) {
    .podPicture{
        scale: 1.1;
    }
    .pod{
        padding-bottom: 60px;
    }
    .con{
        scale: 0.9;
    }
}
@media (max-width:1920px) {
    .podPicture{
        scale: 1;
    }
    .pod{
        padding-bottom: 20px;
    }
    .con{
        
        top: -20px;
        right: -15px;
        scale: 0.8;
        padding-right: 24px;
    }
}
@media (max-width:1620px) {
    .ps{
        font-size: 48px;
    }
    .con{
        top: -30px;
        right: -25px;
        scale: 0.7;
        padding-right: 12px;
    }
}
@media (max-width:1440px) {
    .ps{
        font-size: 24px;
    }
    .text{
        font-size: 18px;
    }
}
@media (max-width:1280px) {
    .con{
        top: -40px;
        right: -35px;
        scale: 0.6;
        padding-right: 6px;
    }
}
@media (max-width:900px) {
    .con{
        top: -50px;
        right: -55px;
        scale: 0.4;
    }
}
</style>

<body class="px-32 hidden-scroll 2xl:px-16 xl:px-8 lg:px-6 md:px-4">
    <div class="box">
        <div class="my-8 px-8">
            <div class="naf">  
                <p class="text">/Жидвока Елена/</p>
                <p class="ps">ТРАНСПЕРСОНАЛЬНЫЙ ПСИХОЛОГ</p>
                <p class="text">2026</p>
            </div>
        </div>
        <div #main class="OurMain py-8 mx-32">
            <div class="hero flex justify-center gap-16 mx-8">
                <div class="name">
                    <img src="model/name.png ">
                </div>
                <div class="relative">
                    <div class="name1">
                        <img src="model/gor.png ">
                    </div>
                    <a class="con absolute">
                        <img src = "model/conta.png" onclick="alert('+7 900 234 01 13')">
                    </a>
                </div>
            </div>
            <div class="bi py-8 mx-4">
                    <img src="model/bio.png ">
                </div>
                <!-- <div class = "check">
                    <img src="model/check.png" onclick="alert('+7 900 234 01 13')">
                </div> -->
                <div class="bio1 mx-4">
                    <img src="model/infa.png">
                </div>
                <div class="angel py-8 mx-4">
                    <img src="model/angel.png">
                </div>



        <div class="pod mx-4">
            <img class="podPicture" src="model/pod2.jpg">
        </div>
    </div>
</body>
